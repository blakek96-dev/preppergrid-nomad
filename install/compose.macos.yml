# macOS / Apple Silicon variant — PrepperGrid N.O.M.A.D. fork
# Requires install/compose.macos.env to be generated by the installer first
# ARM64 note: upstream image is amd64 only.
# This fork builds ARM64 at ghcr.io/blakek96-dev/preppergrid-nomad
# If ARM64 unavailable, add platform: linux/amd64 to run under Rosetta 2.
name: preppergrid-nomad

services:
  admin:
    image: ${NOMAD_IMAGE:-ghcr.io/blakek96-dev/preppergrid-nomad:arm64-latest}
    platform: linux/arm64
    pull_policy: always
    container_name: nomad_admin
    restart: unless-stopped
    env_file:
      - compose.macos.env
    ports:
      - "8080:8080"
    volumes:
      - ${NOMAD_DIR}/storage:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - nomad-update-shared:/app/update-shared
    environment:
      - NODE_ENV=production
      - PORT=8080
      - LOG_LEVEL=info
      - APP_KEY=REPLACEME
      - HOST=0.0.0.0
      - URL=replaceme
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=nomad
      - DB_USER=nomad_user
      - DB_PASSWORD=replaceme
      - DB_NAME=nomad
      - DB_SSL=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DISABLE_COMPRESSION=false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dozzle:
    image: amir20/dozzle:v10.0
    container_name: nomad_dozzle
    restart: unless-stopped
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOZZLE_ENABLE_ACTIONS=false
      - DOZZLE_ENABLE_SHELL=false

  mysql:
    image: mariadb:11
    container_name: nomad_mysql
    restart: unless-stopped
    env_file:
      - compose.macos.env
    environment:
      - MYSQL_ROOT_PASSWORD=replaceme
      - MYSQL_DATABASE=nomad
      - MYSQL_USER=nomad_user
      - MYSQL_PASSWORD=replaceme
    volumes:
      - ${NOMAD_DIR}/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nomad_redis
    restart: unless-stopped
    env_file:
      - compose.macos.env
    volumes:
      - ${NOMAD_DIR}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  updater:
    image: ghcr.io/crosstalk-solutions/project-nomad-sidecar-updater:latest
    pull_policy: always
    container_name: nomad_updater
    restart: unless-stopped
    env_file:
      - compose.macos.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${NOMAD_DIR}:${NOMAD_DIR}
      - nomad-update-shared:/shared

volumes:
  nomad-update-shared:
    driver: local
