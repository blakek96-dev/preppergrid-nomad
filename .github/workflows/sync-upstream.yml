name: Sync Upstream

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync-upstream:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect latest upstream version
        id: upstream
        run: |
          set -euo pipefail

          if [[ ! -f .upstream-version ]]; then
            echo "none" > .upstream-version
          fi

          current_version="$(cat .upstream-version)"

          python3 <<'PY' > /tmp/upstream-version.env
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          release_api = "https://api.github.com/repos/Crosstalk-Solutions/project-nomad/releases/latest"
          tags_api = "https://api.github.com/repos/Crosstalk-Solutions/project-nomad/tags"

          def fetch_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "preppergrid-nomad-upstream-sync",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return json.load(response)
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, json.JSONDecodeError):
                  return None

          release = fetch_json(release_api)
          if isinstance(release, dict) and release.get("tag_name"):
              tag = release["tag_name"]
              release_url = release.get("html_url") or f"https://github.com/Crosstalk-Solutions/project-nomad/releases/tag/{tag}"
              print(f"UPSTREAM_VERSION={tag}")
              print(f"UPSTREAM_RELEASE_URL={release_url}")
              print(f"UPSTREAM_CHANGELOG_URL={release_url}")
              sys.exit(0)

          tags = fetch_json(tags_api)
          if isinstance(tags, list) and tags:
              tag = tags[0].get("name")
              if tag:
                  release_url = f"https://github.com/Crosstalk-Solutions/project-nomad/releases/tag/{tag}"
                  changelog_url = "https://github.com/Crosstalk-Solutions/project-nomad/releases"
                  print(f"UPSTREAM_VERSION={tag}")
                  print(f"UPSTREAM_RELEASE_URL={release_url}")
                  print(f"UPSTREAM_CHANGELOG_URL={changelog_url}")
                  sys.exit(0)

          print("UPSTREAM_VERSION=")
          print("UPSTREAM_RELEASE_URL=")
          print("UPSTREAM_CHANGELOG_URL=")
          PY

          source /tmp/upstream-version.env

          if [[ -z "${UPSTREAM_VERSION}" ]]; then
            echo "::warning::No upstream releases or tags found"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${UPSTREAM_VERSION}" == "${current_version}" ]]; then
            echo "Already tracking upstream ${UPSTREAM_VERSION}."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "${UPSTREAM_VERSION}" > .upstream-version
          {
            echo "changed=true"
            echo "version=${UPSTREAM_VERSION}"
            echo "release_url=${UPSTREAM_RELEASE_URL}"
            echo "changelog_url=${UPSTREAM_CHANGELOG_URL}"
          } >> "$GITHUB_OUTPUT"

      - name: Create upstream sync pull request
        if: steps.upstream.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: sync upstream ${{ steps.upstream.outputs.version }}"
          branch: chore/sync-upstream-${{ steps.upstream.outputs.version }}
          delete-branch: true
          draft: true
          title: "chore: sync upstream ${{ steps.upstream.outputs.version }}"
          body: |
            Upstream release URL: ${{ steps.upstream.outputs.release_url }}

            Changelog link: ${{ steps.upstream.outputs.changelog_url }}

            Before merging:
            - Verify the ARM64 build completes successfully.
            - Inspect Dockerfile for amd64-only assumptions.
