name: Build ARM64 Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  packages: write
  contents: read

concurrency:
  group: build-arm64
  cancel-in-progress: true

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx with ARM64 platform support
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/arm64

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ARM64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/blakek96-dev/preppergrid-nomad:arm64-latest
            ghcr.io/blakek96-dev/preppergrid-nomad:arm64-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published ARM64 manifest
        env:
          IMAGE_REF: ghcr.io/blakek96-dev/preppergrid-nomad:arm64-${{ github.sha }}
        run: |
          set -euo pipefail
          MANIFEST_JSON="$(docker buildx imagetools inspect "${IMAGE_REF}" --format '{{json .Manifest}}')"
          export MANIFEST_JSON
          python3 -c 'import json, os, sys; manifest = json.loads(os.environ["MANIFEST_JSON"]); architecture = manifest.get("platform", {}).get("architecture"); print("Verified ARM64 manifest for " + os.environ["IMAGE_REF"]) if architecture == "arm64" else (print(f"Expected arm64 manifest, got {architecture}", file=sys.stderr), sys.exit(1))'

      - name: Publish build digest summary
        run: |
          {
            echo "## ARM64 Image"
            echo ""
            echo "- Image: \`ghcr.io/blakek96-dev/preppergrid-nomad:arm64-${{ github.sha }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
